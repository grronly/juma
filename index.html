<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMA.IO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface2: #f0f0f0;
    --surface3: #e8e8e8;
    --border: #d8d8d8;
    --border2: #c8c8c8;
    --accent: #111111;
    --accent-dim: rgba(0,0,0,0.06);
    --accent-dim2: rgba(0,0,0,0.03);
    --text: #111111;
    --text2: #444444;
    --text3: #888888;
    --red: #cc3333;
    --green: #2a7a4f;
    --blue: #1a4fcc;
    --purple: #6633cc;
    --radius: 6px;
    --radius-lg: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.12);
    --shadow-card: 0 1px 4px rgba(0,0,0,0.1);
    --col-width: 300px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 16px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .logo span { color: var(--text3); }

  .board-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    overflow: hidden;
  }

  .board-tab {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text3);
    border: 1px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .board-tab:hover { color: var(--text2); background: var(--surface2); }
  .board-tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim2); }

  .btn-new-board {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text3);
    border: 1px dashed var(--border2);
    background: transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-new-board:hover { color: var(--text2); border-color: var(--text3); }

  .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { color: var(--text); border-color: var(--text3); }
  .btn.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 500;
  }
  .btn.primary:hover { background: #ffc433; }

  /* ── BOARD AREA ── */
  #board-area {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 20px 24px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  /* ── COLUMNS ── */
  .column {
    width: var(--col-width);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    max-height: calc(100vh - 92px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .column.drag-over { border-color: var(--accent); background: var(--accent-dim); }

  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .col-title-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }

  .col-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .col-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text2);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    min-width: 0;
  }
  .col-title:focus { color: var(--text); }

  .col-count {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .col-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .col-btn {
    width: 24px; height: 24px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-size: 14px;
  }
  .col-btn:hover { background: var(--surface2); color: var(--text2); }
  .col-btn.danger:hover { background: rgba(224,85,85,0.1); color: var(--red); }

  .cards-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }
  .cards-list::-webkit-scrollbar { width: 4px; }
  .cards-list::-webkit-scrollbar-track { background: transparent; }
  .cards-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .col-add-btn {
    margin: 4px 10px 10px;
    padding: 8px;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .col-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim2); }

  /* ── CARDS ── */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px;
    cursor: grab;
    transition: all 0.15s;
    position: relative;
  }
  .card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .card.dragging { opacity: 0.4; transform: scale(0.97); cursor: grabbing; }
  .card.drag-placeholder { background: var(--accent-dim); border: 1px dashed var(--accent); opacity: 0.5; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
  }

  .card-title {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 6px;
    word-break: break-word;
  }

  .card-desc {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }

  .card-due {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-due.overdue { color: var(--red); }
  .card-due.soon { color: var(--accent); }

  .card-checklist-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .checklist-progress {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    min-width: 40px;
  }
  .checklist-progress-fill {
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .card-client-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    color: var(--text3);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ADD COLUMN */
  .add-column-btn {
    width: var(--col-width);
    flex-shrink: 0;
    height: 52px;
    border: 1px dashed var(--border2);
    border-radius: var(--radius-lg);
    background: transparent;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    align-self: flex-start;
  }
  .add-column-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim2); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    width: 560px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 0;
    flex-shrink: 0;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--text);
  }

  .modal-close {
    width: 28px; height: 28px;
    border-radius: 4px;
    border: none;
    background: var(--surface2);
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .modal-footer { padding: 0 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .input, .textarea, .select {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 9px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--text); }
  .textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .select { cursor: pointer; }
  .select option { background: var(--surface); color: var(--text); }

  /* Tag picker */
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-pick-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.5;
  }
  .tag-pick-btn.selected { opacity: 1; }

  /* Checklist */
  .checklist-items { display: flex; flex-direction: column; gap: 6px; }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checklist-item input[type="checkbox"] {
    accent-color: var(--text);
    width: 14px; height: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .checklist-item .check-label {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 3px 0;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    outline: none;
  }
  .checklist-item .check-label:focus { border-color: var(--accent); }
  .checklist-item .check-label.done { text-decoration: line-through; color: var(--text3); }
  .checklist-item .del-check {
    width: 20px; height: 20px;
    border: none; background: transparent;
    color: var(--text3); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px; transition: all 0.15s; flex-shrink: 0;
  }
  .checklist-item .del-check:hover { background: rgba(224,85,85,0.1); color: var(--red); }

  .btn-add-check {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 6px;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    margin-top: 2px;
  }
  .btn-add-check:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim2); }

  /* Color picker for col */
  .color-dots { display: flex; gap: 8px; }
  .color-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .color-dot.selected { border-color: #fff; transform: scale(1.15); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #ffffff;
    z-index: 9999;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar board */
  #board-area::-webkit-scrollbar { height: 5px; }
  #board-area::-webkit-scrollbar-track { background: transparent; }
  #board-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Empty state */
  .empty-board {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 12px; color: var(--text3); text-align: center;
  }
  .empty-board .big-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px; color: var(--border2); line-height: 1;
  }
  .empty-board p { font-size: 12px; line-height: 1.6; max-width: 260px; }

  /* Client manager mini */
  .client-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .client-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .client-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .client-name { flex: 1; font-size: 12px; color: var(--text2); }
  .client-del { background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 14px; line-height: 1; }
  .client-del:hover { color: var(--red); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">JUMA<span>.IO</span></div>
  <div class="board-selector" id="boardTabs"></div>
  <div class="header-actions">
    <button class="btn" onclick="openClientsModal()">👤 Clientes</button>
    <button class="btn" onclick="exportData()">↑ Export</button>
    <label class="btn" style="cursor:pointer">
      ↓ Import <input type="file" accept=".json" style="display:none" onchange="importData(event)">
    </label>
  </div>
</header>

<div id="board-area"></div>

<!-- Toast -->
<div id="toast"></div>

<!-- ── CARD MODAL ── -->
<div class="modal-overlay" id="cardModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="cardModalTitle">Novo card</div>
      <button class="modal-close" onclick="closeCardModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Título *</label>
        <input class="input" id="cardTitle" placeholder="Nome do card / tarefa" />
      </div>
      <div class="field">
        <label>Descrição</label>
        <textarea class="textarea" id="cardDesc" placeholder="Detalhes, briefing, notas..."></textarea>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Cliente</label>
          <select class="select" id="cardClient">
            <option value="">— sem cliente —</option>
          </select>
        </div>
        <div class="field">
          <label>Prazo</label>
          <input type="date" class="input" id="cardDue" />
        </div>
      </div>
      <div class="field">
        <label>Tags</label>
        <div class="tag-picker" id="tagPicker"></div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label>Checklist</label>
        <div class="checklist-items" id="checklistItems"></div>
        <button class="btn-add-check" onclick="addCheckItem()">+ Adicionar item</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="deleteCardBtn" onclick="deleteCard()" style="display:none;color:var(--red);border-color:rgba(224,85,85,0.3)">Excluir card</button>
      <button class="btn" onclick="closeCardModal()">Cancelar</button>
      <button class="btn primary" onclick="saveCard()">Salvar</button>
    </div>
  </div>
</div>

<!-- ── COLUMN MODAL ── -->
<div class="modal-overlay" id="colModal">
  <div class="modal" style="width:380px">
    <div class="modal-header">
      <div class="modal-title" id="colModalTitle">Nova coluna</div>
      <button class="modal-close" onclick="closeColModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nome da coluna</label>
        <input class="input" id="colName" placeholder="Ex: Em andamento" />
      </div>
      <div class="field">
        <label>Cor</label>
        <div class="color-dots" id="colColorPicker"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeColModal()">Cancelar</button>
      <button class="btn primary" onclick="saveColumn()">Salvar</button>
    </div>
  </div>
</div>

<!-- ── BOARD MODAL ── -->
<div class="modal-overlay" id="boardModal">
  <div class="modal" style="width:380px">
    <div class="modal-header">
      <div class="modal-title">Novo quadro</div>
      <button class="modal-close" onclick="closeBoardModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nome do quadro</label>
        <input class="input" id="boardName" placeholder="Ex: Mr. Bob Barbearia" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeBoardModal()">Cancelar</button>
      <button class="btn primary" onclick="saveBoard()">Criar</button>
    </div>
  </div>
</div>

<!-- ── CLIENTS MODAL ── -->
<div class="modal-overlay" id="clientsModal">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <div class="modal-title">Clientes</div>
      <button class="modal-close" onclick="closeClientsModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Adicionar cliente</label>
        <div style="display:flex;gap:8px">
          <input class="input" id="newClientName" placeholder="Nome do cliente" style="flex:1" />
          <select class="select" id="newClientColor" style="width:120px">
            <option value="#F0A500">Dourado</option>
            <option value="#e05555">Vermelho</option>
            <option value="#4caf7d">Verde</option>
            <option value="#5b8dee">Azul</option>
            <option value="#9b6dff">Roxo</option>
            <option value="#e0855a">Laranja</option>
            <option value="#5ad4e0">Ciano</option>
          </select>
          <button class="btn primary" onclick="addClient()">+</button>
        </div>
      </div>
      <div class="field">
        <label>Lista</label>
        <div class="client-list" id="clientList"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn primary" onclick="closeClientsModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════
//  STATE
// ══════════════════════════════════
const COL_COLORS = ['#F0A500','#e05555','#4caf7d','#5b8dee','#9b6dff','#e0855a','#5ad4e0','#aaa'];

const DEFAULT_TAGS = [
  { id:'t1', label:'Identidade Visual', color:'#9b6dff' },
  { id:'t2', label:'Social Media', color:'#5b8dee' },
  { id:'t3', label:'Branding', color:'#F0A500' },
  { id:'t4', label:'Copy', color:'#4caf7d' },
  { id:'t5', label:'Web', color:'#5ad4e0' },
  { id:'t6', label:'Revisão', color:'#e05555' },
  { id:'t7', label:'Entregue', color:'#4caf7d' },
];

let state = {
  boards: [],
  activeBoardId: null,
  clients: [],
  tags: [...DEFAULT_TAGS],
};

function loadState() {
  const raw = localStorage.getItem('juma_kanban_v2');
  if (raw) {
    try { state = { ...state, ...JSON.parse(raw) }; } catch(e) {}
  }
  if (!state.boards.length) {
    // default board
    const b = newBoard('Juma — Geral');
    b.columns = [
      newColumn('Backlog','#555'),
      newColumn('Em andamento','#F0A500'),
      newColumn('Revisão','#5b8dee'),
      newColumn('Concluído','#4caf7d'),
    ];
    state.boards.push(b);
    state.activeBoardId = b.id;
  }
}

function saveState() {
  localStorage.setItem('juma_kanban_v2', JSON.stringify(state));
}

function uid() { return Math.random().toString(36).slice(2,10); }

function newBoard(name) {
  return { id: uid(), name, columns: [] };
}

function newColumn(name, color='#F0A500') {
  return { id: uid(), name, color, cards: [] };
}

function newCard(title) {
  return { id: uid(), title, desc: '', client:'', due:'', tags:[], checklist:[] };
}

function activeBoard() {
  return state.boards.find(b => b.id === state.activeBoardId);
}

// ══════════════════════════════════
//  RENDER
// ══════════════════════════════════
function render() {
  renderBoardTabs();
  renderBoard();
  saveState();
}

function renderBoardTabs() {
  const el = document.getElementById('boardTabs');
  el.innerHTML = '';
  state.boards.forEach(b => {
    const tab = document.createElement('button');
    tab.className = 'board-tab' + (b.id === state.activeBoardId ? ' active' : '');
    tab.textContent = b.name;
    tab.onclick = () => { state.activeBoardId = b.id; render(); };
    el.appendChild(tab);
  });
  const nb = document.createElement('button');
  nb.className = 'btn-new-board';
  nb.textContent = '+ Quadro';
  nb.onclick = openBoardModal;
  el.appendChild(nb);
}

function renderBoard() {
  const area = document.getElementById('board-area');
  area.innerHTML = '';
  const board = activeBoard();
  if (!board) return;

  if (!board.columns.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-board';
    empty.innerHTML = `<div class="big-letter">J</div><p>Nenhuma coluna ainda.<br>Adicione uma coluna para começar.</p>`;
    area.appendChild(empty);
  }

  board.columns.forEach(col => {
    area.appendChild(buildColumn(col));
  });

  // Add column btn
  const addBtn = document.createElement('button');
  addBtn.className = 'add-column-btn';
  addBtn.textContent = '+ Nova Coluna';
  addBtn.onclick = () => openColModal(null);
  area.appendChild(addBtn);
}

function buildColumn(col) {
  const el = document.createElement('div');
  el.className = 'column';
  el.dataset.colId = col.id;

  // Header
  const header = document.createElement('div');
  header.className = 'col-header';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'col-title-wrap';

  const dot = document.createElement('div');
  dot.className = 'col-dot';
  dot.style.background = col.color;

  const title = document.createElement('input');
  title.className = 'col-title';
  title.value = col.name;
  title.onblur = e => { col.name = e.target.value; saveState(); };
  title.onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };

  titleWrap.appendChild(dot);
  titleWrap.appendChild(title);

  const count = document.createElement('span');
  count.className = 'col-count';
  count.textContent = col.cards.length;

  const actions = document.createElement('div');
  actions.className = 'col-actions';

  const editBtn = document.createElement('button');
  editBtn.className = 'col-btn';
  editBtn.title = 'Editar coluna';
  editBtn.innerHTML = '⚙';
  editBtn.onclick = () => openColModal(col);

  const delBtn = document.createElement('button');
  delBtn.className = 'col-btn danger';
  delBtn.title = 'Excluir coluna';
  delBtn.innerHTML = '×';
  delBtn.onclick = () => deleteColumn(col.id);

  actions.appendChild(editBtn);
  actions.appendChild(delBtn);

  header.appendChild(titleWrap);
  header.appendChild(count);
  header.appendChild(actions);

  // Cards list
  const list = document.createElement('div');
  list.className = 'cards-list';
  list.dataset.colId = col.id;

  col.cards.forEach(card => {
    list.appendChild(buildCard(card, col.id));
  });

  // Drag events on list
  list.addEventListener('dragover', onDragOver);
  list.addEventListener('drop', onDrop);
  list.addEventListener('dragleave', onDragLeave);

  // Add card btn
  const addBtn = document.createElement('button');
  addBtn.className = 'col-add-btn';
  addBtn.textContent = '+ Card';
  addBtn.onclick = () => openCardModal(null, col.id);

  el.appendChild(header);
  el.appendChild(list);
  el.appendChild(addBtn);
  return el;
}

function buildCard(card, colId) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.dataset.colId = colId;

  // Tags
  if (card.tags && card.tags.length) {
    const tagsEl = document.createElement('div');
    tagsEl.className = 'card-tags';
    card.tags.forEach(tid => {
      const tag = state.tags.find(t => t.id === tid);
      if (!tag) return;
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = tag.label;
      t.style.background = hexAlpha(tag.color, 0.15);
      t.style.color = tag.color;
      tagsEl.appendChild(t);
    });
    el.appendChild(tagsEl);
  }

  // Title
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title';
  titleEl.textContent = card.title;
  el.appendChild(titleEl);

  // Desc
  if (card.desc) {
    const d = document.createElement('div');
    d.className = 'card-desc';
    d.textContent = card.desc;
    el.appendChild(d);
  }

  // Meta row
  const meta = document.createElement('div');
  meta.className = 'card-meta';

  // Due date
  if (card.due) {
    const due = document.createElement('span');
    due.className = 'card-due';
    const diff = dateDiff(card.due);
    if (diff < 0) due.classList.add('overdue');
    else if (diff <= 2) due.classList.add('soon');
    due.innerHTML = `📅 ${formatDate(card.due)}`;
    meta.appendChild(due);
  }

  // Checklist
  if (card.checklist && card.checklist.length) {
    const done = card.checklist.filter(i => i.done).length;
    const total = card.checklist.length;
    const bar = document.createElement('div');
    bar.className = 'card-checklist-bar';
    bar.innerHTML = `
      <span>${done}/${total}</span>
      <div class="checklist-progress">
        <div class="checklist-progress-fill" style="width:${(done/total)*100}%"></div>
      </div>`;
    meta.appendChild(bar);
  }

  // Client
  if (card.client) {
    const cl = state.clients.find(c => c.id === card.client);
    if (cl) {
      const badge = document.createElement('span');
      badge.className = 'card-client-badge';
      badge.textContent = cl.name;
      badge.style.borderColor = hexAlpha(cl.color, 0.4);
      badge.style.color = cl.color;
      meta.appendChild(badge);
    }
  }

  if (meta.children.length) el.appendChild(meta);

  // Drag events
  el.addEventListener('dragstart', onDragStart);
  el.addEventListener('dragend', onDragEnd);
  el.addEventListener('click', (e) => {
    if (!e.target.closest('button')) openCardModal(card, colId);
  });

  return el;
}

// ══════════════════════════════════
//  DRAG & DROP
// ══════════════════════════════════
let dragCardId = null, dragSourceColId = null;

function onDragStart(e) {
  dragCardId = e.currentTarget.dataset.cardId;
  dragSourceColId = e.currentTarget.dataset.colId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const list = e.currentTarget;
  list.closest('.column').classList.add('drag-over');

  // Placeholder positioning
  const afterEl = getDragAfterElement(list, e.clientY);
  const placeholder = document.querySelector('.drag-placeholder');
  const ph = placeholder || (() => {
    const d = document.createElement('div');
    d.className = 'card drag-placeholder';
    d.style.height = '44px';
    return d;
  })();

  if (afterEl == null) list.appendChild(ph);
  else list.insertBefore(ph, afterEl);
}

function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.closest('.column').classList.remove('drag-over');
    document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
  }
}

function onDrop(e) {
  e.preventDefault();
  const targetColId = e.currentTarget.dataset.colId;
  const afterEl = getDragAfterElement(e.currentTarget, e.clientY);

  const board = activeBoard();
  const srcCol = board.columns.find(c => c.id === dragSourceColId);
  const dstCol = board.columns.find(c => c.id === targetColId);
  if (!srcCol || !dstCol) return;

  const cardIdx = srcCol.cards.findIndex(c => c.id === dragCardId);
  if (cardIdx === -1) return;

  const [card] = srcCol.cards.splice(cardIdx, 1);

  let insertIdx = dstCol.cards.length;
  if (afterEl && afterEl.dataset.cardId) {
    insertIdx = dstCol.cards.findIndex(c => c.id === afterEl.dataset.cardId);
    if (insertIdx === -1) insertIdx = dstCol.cards.length;
  }

  dstCol.cards.splice(insertIdx, 0, card);

  document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

  render();
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.card:not(.dragging):not(.drag-placeholder)')];
  return els.reduce((closest, el) => {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: el };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

// ══════════════════════════════════
//  CARD MODAL
// ══════════════════════════════════
let _editCardId = null, _editColId = null;

function openCardModal(card, colId) {
  _editColId = colId;
  _editCardId = card ? card.id : null;

  document.getElementById('cardModalTitle').textContent = card ? 'Editar card' : 'Novo card';
  document.getElementById('cardTitle').value = card ? card.title : '';
  document.getElementById('cardDesc').value = card ? card.desc : '';
  document.getElementById('cardDue').value = card ? card.due : '';
  document.getElementById('deleteCardBtn').style.display = card ? '' : 'none';

  // Populate client select
  const sel = document.getElementById('cardClient');
  sel.innerHTML = '<option value="">— sem cliente —</option>';
  state.clients.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if (card && card.client === c.id) opt.selected = true;
    sel.appendChild(opt);
  });

  // Tags
  const tp = document.getElementById('tagPicker');
  tp.innerHTML = '';
  state.tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pick-btn' + (card && card.tags.includes(tag.id) ? ' selected' : '');
    btn.textContent = tag.label;
    btn.style.background = hexAlpha(tag.color, 0.15);
    btn.style.color = tag.color;
    btn.style.borderColor = btn.classList.contains('selected') ? tag.color : 'transparent';
    btn.dataset.tagId = tag.id;
    btn.onclick = () => {
      btn.classList.toggle('selected');
      btn.style.borderColor = btn.classList.contains('selected') ? tag.color : 'transparent';
      btn.style.opacity = btn.classList.contains('selected') ? '1' : '0.5';
    };
    tp.appendChild(btn);
  });

  // Checklist
  const cl = document.getElementById('checklistItems');
  cl.innerHTML = '';
  if (card && card.checklist) {
    card.checklist.forEach(item => addCheckItem(item));
  }

  document.getElementById('cardModal').classList.add('open');
  setTimeout(() => document.getElementById('cardTitle').focus(), 50);
}

function closeCardModal() {
  document.getElementById('cardModal').classList.remove('open');
}

function addCheckItem(item = null) {
  const list = document.getElementById('checklistItems');
  const row = document.createElement('div');
  row.className = 'checklist-item';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = item ? item.done : false;

  const lbl = document.createElement('input');
  lbl.className = 'check-label' + (item && item.done ? ' done' : '');
  lbl.placeholder = 'Item da checklist...';
  lbl.value = item ? item.text : '';

  cb.onchange = () => { lbl.classList.toggle('done', cb.checked); };

  const del = document.createElement('button');
  del.className = 'del-check';
  del.innerHTML = '×';
  del.onclick = () => row.remove();

  row.appendChild(cb);
  row.appendChild(lbl);
  row.appendChild(del);
  list.appendChild(row);

  if (!item) lbl.focus();
}

function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title) { toast('Título obrigatório'); return; }

  const selectedTags = [...document.querySelectorAll('#tagPicker .tag-pick-btn.selected')].map(b => b.dataset.tagId);

  const checklistItems = [...document.querySelectorAll('#checklistItems .checklist-item')].map(row => ({
    text: row.querySelector('.check-label').value,
    done: row.querySelector('input[type="checkbox"]').checked,
  })).filter(i => i.text.trim());

  const board = activeBoard();
  const col = board.columns.find(c => c.id === _editColId);
  if (!col) return;

  if (_editCardId) {
    const card = col.cards.find(c => c.id === _editCardId);
    if (card) {
      card.title = title;
      card.desc = document.getElementById('cardDesc').value;
      card.client = document.getElementById('cardClient').value;
      card.due = document.getElementById('cardDue').value;
      card.tags = selectedTags;
      card.checklist = checklistItems;
    }
  } else {
    const card = newCard(title);
    card.desc = document.getElementById('cardDesc').value;
    card.client = document.getElementById('cardClient').value;
    card.due = document.getElementById('cardDue').value;
    card.tags = selectedTags;
    card.checklist = checklistItems;
    col.cards.push(card);
  }

  closeCardModal();
  render();
  toast(_editCardId ? 'Card atualizado' : 'Card criado');
}

function deleteCard() {
  if (!confirm('Excluir este card?')) return;
  const board = activeBoard();
  const col = board.columns.find(c => c.id === _editColId);
  if (!col) return;
  col.cards = col.cards.filter(c => c.id !== _editCardId);
  closeCardModal();
  render();
  toast('Card excluído');
}

// ══════════════════════════════════
//  COLUMN MODAL
// ══════════════════════════════════
let _editColObj = null;

function openColModal(col) {
  _editColObj = col;
  document.getElementById('colModalTitle').textContent = col ? 'Editar coluna' : 'Nova coluna';
  document.getElementById('colName').value = col ? col.name : '';

  const picker = document.getElementById('colColorPicker');
  picker.innerHTML = '';
  COL_COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (col && col.color === c ? ' selected' : (!col && c === '#F0A500' ? ' selected' : ''));
    dot.style.background = c;
    dot.dataset.color = c;
    dot.onclick = () => {
      picker.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
    };
    picker.appendChild(dot);
  });

  document.getElementById('colModal').classList.add('open');
  setTimeout(() => document.getElementById('colName').focus(), 50);
}

function closeColModal() {
  document.getElementById('colModal').classList.remove('open');
}

function saveColumn() {
  const name = document.getElementById('colName').value.trim();
  if (!name) { toast('Nome obrigatório'); return; }
  const color = document.querySelector('#colColorPicker .color-dot.selected')?.dataset.color || '#F0A500';

  const board = activeBoard();
  if (_editColObj) {
    const col = board.columns.find(c => c.id === _editColObj.id);
    if (col) { col.name = name; col.color = color; }
  } else {
    board.columns.push(newColumn(name, color));
  }

  closeColModal();
  render();
}

function deleteColumn(colId) {
  const board = activeBoard();
  const col = board.columns.find(c => c.id === colId);
  if (!col) return;
  if (col.cards.length && !confirm(`Excluir coluna "${col.name}" e seus ${col.cards.length} cards?`)) return;
  board.columns = board.columns.filter(c => c.id !== colId);
  render();
  toast('Coluna excluída');
}

// ══════════════════════════════════
//  BOARD MODAL
// ══════════════════════════════════
function openBoardModal() {
  document.getElementById('boardName').value = '';
  document.getElementById('boardModal').classList.add('open');
  setTimeout(() => document.getElementById('boardName').focus(), 50);
}
function closeBoardModal() {
  document.getElementById('boardModal').classList.remove('open');
}
function saveBoard() {
  const name = document.getElementById('boardName').value.trim();
  if (!name) { toast('Nome obrigatório'); return; }
  const b = newBoard(name);
  b.columns = [newColumn('Backlog','#555'), newColumn('Em andamento','#F0A500'), newColumn('Concluído','#4caf7d')];
  state.boards.push(b);
  state.activeBoardId = b.id;
  closeBoardModal();
  render();
  toast(`Quadro "${name}" criado`);
}

// ══════════════════════════════════
//  CLIENTS MODAL
// ══════════════════════════════════
function openClientsModal() {
  renderClientList();
  document.getElementById('clientsModal').classList.add('open');
}
function closeClientsModal() {
  document.getElementById('clientsModal').classList.remove('open');
  render();
}
function renderClientList() {
  const el = document.getElementById('clientList');
  el.innerHTML = '';
  if (!state.clients.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:8px 0">Nenhum cliente cadastrado.</div>';
    return;
  }
  state.clients.forEach(c => {
    const item = document.createElement('div');
    item.className = 'client-item';
    item.innerHTML = `
      <div class="client-dot" style="background:${c.color}"></div>
      <div class="client-name">${c.name}</div>
      <button class="client-del" onclick="removeClient('${c.id}')">×</button>`;
    el.appendChild(item);
  });
}
function addClient() {
  const name = document.getElementById('newClientName').value.trim();
  const color = document.getElementById('newClientColor').value;
  if (!name) { toast('Digite um nome'); return; }
  if (state.clients.find(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Cliente já existe'); return; }
  state.clients.push({ id: uid(), name, color });
  document.getElementById('newClientName').value = '';
  saveState();
  renderClientList();
  toast(`Cliente "${name}" adicionado`);
}
function removeClient(id) {
  state.clients = state.clients.filter(c => c.id !== id);
  saveState();
  renderClientList();
}

// ══════════════════════════════════
//  EXPORT / IMPORT
// ══════════════════════════════════
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `juma-kanban-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Dados exportados');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.boards) throw new Error('Formato inválido');
      state = { ...state, ...imported };
      if (!state.activeBoardId && state.boards.length) state.activeBoardId = state.boards[0].id;
      render();
      toast('Dados importados');
    } catch(err) {
      toast('Erro ao importar: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ══════════════════════════════════
//  UTILS
// ══════════════════════════════════
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}

function dateDiff(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  return Math.round((due - today) / 86400000);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});

// ══════════════════════════════════
//  BOOT
// ══════════════════════════════════
loadState();
render();
</script>
</body>
</html>
